<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Purrimeter</title>
<meta name="description" content="A cozy cat tower defense for kids.">
<meta name="theme-color" content="#fbe6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purrimeter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --ink: #4a3b52; --cream: #fffaf3; --mint: #6fcfbe;
    --shadow: 0 4px 0 rgba(74, 59, 82, .18), 0 8px 18px rgba(74, 59, 82, .12);
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px);
    --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #fbe6d4; color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif, "Apple Color Emoji", "Noto Color Emoji";
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; touch-action: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button {
    font: inherit; color: inherit; border: 0; background: var(--cream); border-radius: 999px;
    box-shadow: var(--shadow); cursor: pointer; touch-action: manipulation; padding: 0;
  }
  button:active { translate: 0 2px; scale: .97; }
  [hidden] { display: none !important; }

  .hud { position: fixed; display: flex; gap: 10px; z-index: 5; }
  #stats { top: calc(12px + var(--st)); left: calc(12px + var(--sl)); pointer-events: none; }
  .chip {
    background: var(--cream); border-radius: 999px; padding: 8px 16px 8px 12px; font-size: 26px;
    font-weight: 800; box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px;
    min-width: 96px; font-variant-numeric: tabular-nums;
  }
  #tools { top: calc(12px + var(--st)); right: calc(12px + var(--sr)); }
  .round { width: 60px; height: 60px; font-size: 28px; display: grid; place-items: center; font-weight: 800; }

  #grandma {
    position: fixed; left: calc(16px + var(--sl)); bottom: calc(16px + var(--sb)); z-index: 5;
    width: 88px; height: 88px; font-size: 48px; background: #efe4ff;
  }
  #grandma::after { content: "✨"; position: absolute; right: -2px; top: -4px; font-size: 26px; }
  #grandma.hint { animation: wiggle 1.3s ease-in-out infinite; }
  #grandma.nope, #menu .nope { animation: shake .4s; }
  #go {
    position: fixed; left: 50%; bottom: calc(16px + var(--sb)); translate: -50% 0; z-index: 5;
    width: 96px; height: 96px; font-size: 42px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .15);
    background: radial-gradient(var(--mint) 60%, transparent 61%),
                conic-gradient(#ffffff calc(var(--p, 0) * 360deg), #bfe9e0 0);
  }
  #go:active { translate: -50% 2px; }
  #home { position: fixed; right: calc(16px + var(--sr)); bottom: calc(16px + var(--sb)); z-index: 5; }

  #menu {
    position: fixed; left: 0; top: 0; z-index: 6; display: flex; gap: 6px; padding: 8px;
    background: rgba(255, 250, 243, .97); border-radius: 30px; box-shadow: var(--shadow);
  }
  #menu button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px 4px;
    border-radius: 22px; min-width: 76px; box-shadow: none; background: transparent;
  }
  #menu .ic {
    width: 60px; height: 60px; border-radius: 50%; background: var(--c); display: grid; place-items: center;
    font-size: 32px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12);
  }
  #menu .cost { font-size: 20px; font-weight: 800; white-space: nowrap; }
  #menu button.poor { opacity: .38; }
  #menu .arm .ic { background: #ff9a9a; }
  #menu .lvl { align-self: center; font-size: 22px; padding: 0 6px; white-space: nowrap; }

  #pops { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
  .pop {
    position: absolute; left: 0; top: 0; font-weight: 900; font-size: 24px; white-space: nowrap;
    text-shadow: 0 2px 0 #fff, 0 0 8px #fff; will-change: transform, opacity;
  }
  .pop.gold { color: #e08a00; }
  .pop.bad { color: #e2556f; font-size: 30px; }
  .pop.huge { font-size: 44px; }

  #card {
    position: fixed; top: calc(86px + var(--st)); left: 50%; translate: -50% 0; z-index: 5;
    background: var(--cream); border-radius: 24px; padding: 10px 22px 10px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800;
    transition: opacity .3s, transform .3s; max-width: calc(100vw - 32px); pointer-events: none;
  }
  #card .ic { font-size: 46px; }
  #card small { display: block; font-weight: 600; opacity: .75; font-size: 17px; }
  #card.hide { opacity: 0; transform: translateY(-12px); }

  #overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(251, 230, 212, .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .panel {
    background: var(--cream); border-radius: 36px; padding: 26px 40px 30px; text-align: center;
    box-shadow: var(--shadow); max-width: min(520px, calc(100vw - 32px));
  }
  .panel .logo { font-size: 64px; line-height: 1.1; }
  .panel h1 { margin: .1em 0; font-size: 50px; letter-spacing: .5px; }
  .panel p { margin: .3em 0 1em; font-size: 21px; font-weight: 600; }
  .big { width: 112px; height: 112px; font-size: 52px; background: var(--mint); color: #fff; }

  .howto { max-width: min(940px, calc(100vw - 32px)); }
  .howto h1 { font-size: 42px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 18px 0 16px; }
  .step {
    position: relative; background: #fff1e4; border-radius: 26px; padding: 18px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .step .n {
    position: absolute; top: -12px; left: -8px; width: 38px; height: 38px; border-radius: 50%;
    background: var(--mint); color: #fff; font-size: 22px; font-weight: 900; display: grid; place-items: center;
    box-shadow: var(--shadow);
  }
  .step .pic {
    position: relative; height: 88px; display: flex; align-items: center; justify-content: center;
    gap: 4px; font-size: 36px; white-space: nowrap;
  }
  .step p { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.25; }
  .cushion {
    width: 76px; height: 76px; border-radius: 50%; background: #e6daf6; display: grid; place-items: center;
    font-size: 38px; animation: glow 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 6px rgba(184, 156, 255, .35), 0 0 22px 6px rgba(184, 156, 255, .55);
  }
  .tap { position: absolute; left: calc(50% + 14px); bottom: -14px; font-size: 40px; animation: tap 1.6s ease-in-out infinite; }
  .mini {
    width: 40px; height: 40px; border-radius: 50%; background: var(--c); display: inline-grid; place-items: center;
    flex: none; font-size: 22px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12);
  }
  .mini.go { --c: var(--mint); width: 76px; height: 76px; font-size: 36px; color: #fff; }
  .mini.gm { --c: #efe4ff; width: 52px; height: 52px; font-size: 30px; flex: none; }
  .arrow { font-size: 30px; color: var(--mint); font-weight: 900; }
  .tip { display: flex; align-items: center; justify-content: center; gap: 12px; }
  @keyframes glow { 50% { box-shadow: 0 0 0 10px rgba(184, 156, 255, .25), 0 0 30px 10px rgba(184, 156, 255, .7); } }
  @keyframes tap { 0%, 100% { translate: 0 0 } 50% { translate: -6px -10px } }
  @media (max-width: 860px) { .steps { grid-template-columns: repeat(2, 1fr); } }
  @media (max-height: 520px) {
    .steps { grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0; }
    .step .pic { height: 56px; font-size: 32px; }
    .cushion, .mini.go { width: 52px; height: 52px; font-size: 26px; }
    .step p, .tip { font-size: 15px; }
    .howto h1 { font-size: 30px; }
    .big { width: 80px; height: 80px; font-size: 38px; }
  }
  @keyframes wiggle { 0%, 60%, 100% { rotate: 0deg; scale: 1 } 20% { rotate: -10deg; scale: 1.08 } 40% { rotate: 9deg; scale: 1.08 } }
  @keyframes shake { 0%, 100% { translate: 0 } 25% { translate: -8px } 75% { translate: 8px } }
  @media (max-width: 640px) {
    .chip { font-size: 20px; min-width: 0; padding: 6px 12px 6px 8px; }
    .round { width: 50px; height: 50px; font-size: 24px; }
    #menu button { min-width: 64px; padding: 4px; }
    #menu .ic { width: 50px; height: 50px; font-size: 26px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats" class="hud">
  <div class="chip" aria-label="Fish coins">🐟 <b id="gold">0</b></div>
  <div class="chip" aria-label="Treats left">🍪 <b id="treats">0</b></div>
  <div class="chip" aria-label="Wave">🐾 <b id="wave">0</b></div>
</div>
<div id="tools" class="hud">
  <button id="pause" class="round" aria-label="Pause">⏸</button>
  <button id="speed" class="round" aria-label="Game speed">1×</button>
  <button id="mute" class="round" aria-label="Sound">🔊</button>
  <button id="help" class="round" aria-label="How to play">?</button>
</div>
<button id="grandma" aria-label="Grandma Cat helps">🐱</button>
<button id="go" aria-label="Start the next wave" hidden>▶</button>
<button id="home" class="round" aria-label="Show the whole room">🎯</button>
<div id="menu" hidden></div>
<div id="pops"></div>
<div id="card" class="hide"></div>
<div id="overlay">
  <div class="panel">
    <div class="logo">🐱🍪</div>
    <h1>Purrimeter</h1>
    <p>Help the cats keep the critters away from the treat jar!</p>
    <button id="play" class="big" aria-label="Play">▶</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
